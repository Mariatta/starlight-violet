<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>How an export runs in the Lucky Town Foodie Club app</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b4560"/>
    </marker>
  </defs>
  <rect width="760" height="312" rx="12" fill="#f7f5fb"/>

  <g fill="#ffffff" stroke="#7c5cc4" stroke-width="2">
    <rect x="30" y="40" width="130" height="64" rx="8"/>
    <rect x="230" y="40" width="150" height="64" rx="8"/>
    <rect x="450" y="40" width="130" height="64" rx="8"/>
    <rect x="230" y="190" width="150" height="64" rx="8"/>
    <rect x="450" y="190" width="130" height="64" rx="8"/>
    <rect x="620" y="100" width="115" height="64" rx="8"/>
  </g>

  <g fill="#231d33" text-anchor="middle">
    <text x="95" y="68" font-weight="600">Organizer</text>
    <text x="95" y="88" font-size="12" fill="#5d5670">browser</text>
    <text x="305" y="68" font-weight="600">Web app</text>
    <text x="305" y="88" font-size="12" fill="#5d5670">Django, export screen</text>
    <text x="515" y="68" font-weight="600">Job queue</text>
    <text x="515" y="88" font-size="12" fill="#5d5670">Redis</text>
    <text x="305" y="218" font-weight="600">Postgres</text>
    <text x="305" y="238" font-size="12" fill="#5d5670">events, RSVPs, venues</text>
    <text x="515" y="218" font-weight="600">Export worker</text>
    <text x="515" y="238" font-size="12" fill="#5d5670">Celery, exports queue</text>
    <text x="677" y="128" font-weight="600">Storage</text>
    <text x="677" y="148" font-size="12" fill="#5d5670">S3, photos, exports</text>
  </g>

  <g stroke="#4b4560" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M160 72 H228"/>
    <path d="M380 72 H448"/>
    <path d="M515 104 V188"/>
    <path d="M450 222 H382"/>
    <path d="M620 150 H565 V188"/>
    <path d="M582 244 L710 166"/>
    <path d="M515 256 V284 H95 V106"/>
  </g>

  <g fill="#4b4560" font-size="12">
    <text x="166" y="62">1. start</text>
    <text x="388" y="62">2. enqueue</text>
    <text x="508" y="150" text-anchor="end">3. pick up</text>
    <text x="384" y="242">4. read rows</text>
    <text x="580" y="184">4. read photos</text>
    <text x="662" y="246">5. upload</text>
    <text x="150" y="302">6. email a link that expires in seven days</text>
  </g>
</svg>
